<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CariArsip – Pencarian Lokasi Fisik Arsip Unit Kearsipan</title>

<meta name="description" content="Aplikasi pencarian lokasi fisik arsip otomatis terintegrasi Google Sheets.">
<meta name="author" content="CariArsip">

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800&display=swap" rel="stylesheet">

<!-- PapaParse -->
<script src="https://cdn.jsdelivr.net/npm/papaparse@5.4.1/papaparse.min.js"></script>

<style>
/* Reset & Dasar */
*,::after,::before{box-sizing:border-box;border-width:0;border-style:solid;border-color:#e5e7eb}
body{line-height:inherit;margin:0;font-family:'Inter',sans-serif}

/* Layout & Container */
.container{width:100%;margin-right:auto;margin-left:auto;padding-right:1rem;padding-left:1rem}
.flex{display:flex}
.flex-col{flex-direction:column}
.flex-grow{flex-grow:1}
.items-stretch{align-items:stretch}
.gap-2{gap:0.5rem}
.hidden{display:none}
.min-h-screen{min-height:100vh}
.relative{position:relative}

/* Ukuran & Warna */
.w-full{width:100%}
.max-w-xl{max-width:36rem}
.max-w-3xl{max-width:48rem}
.mx-auto{margin-left:auto;margin-right:auto}
.mt-1{margin-top:0.25rem}.mt-2{margin-top:0.5rem}.mt-4{margin-top:1rem}.mt-6{margin-top:1.5rem}.mt-8{margin-top:2rem}.mb-1{margin-bottom:0.25rem}.mb-3{margin-bottom:0.75rem}
.p-4{padding:1rem}.p-5{padding:1.25rem}.px-4{padding-left:1rem;padding-right:1rem}.py-2{padding-top:0.5rem;padding-bottom:0.5rem}.py-3{padding-top:0.75rem;padding-bottom:0.75rem}.py-8{padding-top:2rem;padding-bottom:2rem}
.bg-slate-900{background-color:#0f172a}.bg-blue-600{background-color:#2563eb}.bg-white{background-color:#fff}.bg-gray-50{background-color:#f9fafb}.bg-slate-50{background-color:#f8fafc}
.rounded-lg{border-radius:.5rem}.rounded-xl{border-radius:.75rem}
.border{border-width:1px}.border-gray-200{border-color:#e5e7eb}.border-slate-200{border-color:#e2e8f0}
.shadow-lg{box-shadow:0 10px 15px -3px rgb(0 0 0 / .1)}.shadow-sm{box-shadow:0 1px 2px 0 rgb(0 0 0 / .05)}

/* Teks & Typography */
.text-center{text-align:center}
.text-xs{font-size:0.75rem;line-height:1rem}
.text-sm{font-size:0.875rem;line-height:1.25rem}
.text-base{font-size:1rem;line-height:1.5rem}
.text-3xl{font-size:1.875rem;line-height:2.25rem}
.font-bold{font-weight:700}.font-extrabold{font-weight:800}.font-medium{font-weight:500}.font-semibold{font-weight:600}
.italic{font-style:italic}
.text-white{color:#fff}.text-blue-500{color:#3b82f6}.text-emerald-600{color:#059669}.text-blue-700{color:#1d4ed8}.text-slate-300{color:#cbd5e1}.text-slate-600{color:#475569}.text-slate-700{color:#334155}.text-slate-800{color:#1e293b}.text-gray-500{color:#6b7280}.text-gray-700{color:#374151}
.font-mono{font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace}

/* Detail Hasil Tampilan */
.card-result {
  background: #ffffff;
  border: 1px solid #e2e8f0;
  border-radius: 0.75rem;
  padding: 1.25rem;
  box-shadow: 0 1px 3px 0 rgba(0,0,0,0.05);
  transition: border-color 0.15s;
}
.card-result:hover {
  border-color: #3b82f6;
}
.detail-grid {
  display: grid;
  grid-template-columns: repeat(1, minmax(0, 1fr));
  gap: 0.5rem;
  font-size: 0.875rem;
  margin-top: 0.75rem;
  background-color: #f8fafc;
  padding: 0.75rem 1rem;
  border-radius: 0.5rem;
  border: 1px solid #f1f5f9;
}
@media (min-width: 640px) {
  .detail-grid {
    grid-template-columns: repeat(2, minmax(0, 1fr));
  }
}
.detail-item {
  display: flex;
  flex-direction: row;
}
.detail-label {
  color: #64748b;
  font-weight: 500;
  min-width: 140px;
}
.detail-val {
  color: #0f172a;
  font-weight: 600;
}

/* Interaksi & Loader */
.hover\:border-blue-400:hover{border-color:#60a5fa}
.transition{transition-property:all;transition-timing-function:cubic-bezier(.4,0,.2,1);transition-duration:.15s}
.loader{border:3px solid #f3f3f3;border-top:3px solid #3b82f6;border-radius:50%;width:24px;height:24px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

@media (min-width: 640px) {
  .container{max-width:640px}
  .sm\:max-w-3xl{max-width:48rem}
  .sm\:flex-row{flex-direction:row}
  .sm\:items-center{align-items:center}
  .sm\:w-auto{width:auto}
  .sm\:px-6{padding-left:1.5rem;padding-right:1.5rem}
  .sm\:py-3{padding-top:0.75rem;padding-bottom:0.75rem}
  .sm\:py-10{padding-top:2.5rem;padding-bottom:2.5rem}
  .sm\:text-4xl{font-size:2.25rem;line-height:2.5rem}
  .sm\:text-base{font-size:1rem;line-height:1.5rem}
  .sm\:text-lg{font-size:1.125rem;line-height:1.75rem}
}
@media (min-width: 768px) {
  .container{max-width:768px}
  .md\:text-lg{font-size:1.125rem;line-height:1.75rem}
}
</style>
</head>

<body class="min-h-screen flex flex-col text-slate-800 bg-white">

<header class="bg-slate-900 text-white py-8 sm:py-10 shadow-lg relative">
  <div class="container mx-auto px-4 text-center">
    <div class="text-3xl sm:text-4xl font-extrabold italic">
      <span class="text-blue-500">Cari</span><span class="text-emerald-600">Arsip</span>
    </div>
    <h1 class="text-sm sm:text-base md:text-lg font-medium text-slate-300 mt-1">
      Pencarian Lokasi Fisik Arsip - Unit Kearsipan
    </h1>
  </div>
</header>

<main id="page-home" class="flex-grow container mx-auto px-4 mt-8 pb-24 relative">

  <div class="max-w-xl sm:max-w-3xl mx-auto">
    <!-- Form Pencarian -->
    <form id="searchForm" class="flex flex-col sm:flex-row gap-2 items-stretch sm:items-center">
      <input id="searchInput"
        class="w-full flex-grow px-4 py-3 rounded-lg border bg-gray-50 text-base"
        placeholder="Ketik uraian arsip, nomor boks, atau kode klasifikasi...">

      <button type="submit"
        class="px-4 py-2 sm:px-6 sm:py-3 bg-blue-600 text-white rounded-lg text-sm sm:text-base font-semibold w-full sm:w-auto">
        CARI
      </button>
    </form>

    <section class="text-sm text-gray-700 mt-4 text-center">
      <p id="statusText">
        Cari lokasi fisik arsip Unit Kearsipan dengan cepat dan akurat.
      </p>
    </section>

    <div id="home-loader" class="hidden mt-6 flex justify-center">
      <div class="loader mx-auto"></div>
    </div>
  </div>

  <div class="max-w-3xl mx-auto mt-6">
    <div id="searchInfo" class="text-sm text-gray-500 mb-3 text-center"></div>
    <div id="resultsContainer" class="space-y-4"></div>
  </div>

</main>

<script>
document.addEventListener("DOMContentLoaded", () => {

// LINK CSV DBASEALL VIA CORS PROXY
const RAW_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTew22s2Qyu_h3wfXf9qgyrUdngYEcFLEbyRe8SW8FgszUwv_b9loSLTM-vJ8YylsRl6gdgchgOKX24/pub?gid=2143819377&single=true&output=csv";
const SHEET_URL = "https://corsproxy.io/?" + encodeURIComponent(RAW_URL);

let archiveData = [];

function loadData() {
  Papa.parse(SHEET_URL, {
    download: true,
    header: true,
    skipEmptyLines: true,
    complete: function(results) {
      archiveData = results.data.filter(row => Object.values(row).some(val => val && val.trim() !== ''));
      console.log("Data berhasil dimuat:", archiveData.length);
      document.getElementById("statusText").innerText = `Database terhubung (${archiveData.length} data siap dicari).`;
    },
    error: function(err) {
      console.error("Gagal load data:", err);
      document.getElementById("statusText").innerText = "Gagal terhubung ke database. Silakan refresh halaman.";
    }
  });
}

function getVal(row, keyName) {
  if (!row) return '-';
  const foundKey = Object.keys(row).find(k => k.trim().toLowerCase() === keyName.toLowerCase());
  return (foundKey && row[foundKey] && row[foundKey].trim() !== '') ? row[foundKey].trim() : '-';
}

function performSearch(q) {
  const terms = q.toLowerCase().split(" ");
  return archiveData.filter(i => {
    const rowValues = Object.values(i).join(" ").toLowerCase();
    return terms.every(term => rowValues.includes(term));
  }).slice(0, 50);
}

function showResults(q) {
  const data = performSearch(q);
  const c = document.getElementById("resultsContainer");
  const info = document.getElementById("searchInfo");

  document.getElementById("home-loader").classList.add("hidden");

  if (data.length > 0) {
    info.innerHTML = `Menampilkan <b>${data.length}</b> hasil untuk: <b>${q}</b>`;
  } else {
    info.innerHTML = `Tidak ditemukan arsip untuk kata kunci <b>${q}</b>`;
  }

  c.innerHTML = data.map(i => {
    const uraian = getVal(i, 'Uraian_Informasi_Arsip');
    const kode = getVal(i, 'Kode_Klasifikasi');
    const boks = getVal(i, 'Boks');
    const folder = getVal(i, 'Folder');
    const berkas = getVal(i, 'No_Berkas');
    const arsip = getVal(i, 'No_Arsip');
    const kurun = getVal(i, 'Kurun_Waktu');
    const tingkat = getVal(i, 'Tingkat_Perkembangan');
    const nasib = getVal(i, 'Nasib_Akhir');

    return `
      <div class="card-result">
        
        <!-- Uraian Informasi Arsip -->
        <div class="mb-2">
          <span class="text-xs font-semibold text-gray-500 uppercase tracking-wider block mb-1">Uraian Informasi Arsip:</span>
          <div class="text-base font-bold text-slate-800 leading-relaxed">
            ${uraian}
          </div>
        </div>

        <!-- Detail Rincian Arsip -->
        <div class="detail-grid">
          <div class="detail-item">
            <span class="detail-label">Kode Klasifikasi:</span>
            <span class="detail-val font-mono text-blue-700">${kode}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">No. Boks:</span>
            <span class="detail-val text-blue-700">${boks}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">No. Folder:</span>
            <span class="detail-val text-blue-700">${folder}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">No. Berkas:</span>
            <span class="detail-val">${berkas}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">No. Arsip:</span>
            <span class="detail-val">${arsip}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Kurun Waktu:</span>
            <span class="detail-val">${kurun}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Tingkat Perkembangan:</span>
            <span class="detail-val">${tingkat}</span>
          </div>

          <div class="detail-item">
            <span class="detail-label">Nasib Akhir:</span>
            <span class="detail-val">${nasib}</span>
          </div>
        </div>

      </div>
    `;
  }).join("");
}

document.getElementById("searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const q = document.getElementById("searchInput").value.trim();
  if (q.length < 1) return;

  document.getElementById("home-loader").classList.remove("hidden");
  setTimeout(() => showResults(q), 150);
});

loadData();

});
</script>

</body>
</html>
